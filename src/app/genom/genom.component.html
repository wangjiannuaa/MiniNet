<div class="genom">
  <h2>{{message.message}}</h2>
  <svg viewBox="0 0 500 100" xmlns="http://www.w3.org/2000/svg" >
  <g role="button" tabindex="0" aria-label="0" aria-label="" (click)="submit()">
    <rect x="10" y="10"
	  width="100" height="44"
	  rx="8" fill="#1976d2"/>
    <text x="60" y="38" text-anchor="middle" fill="white">
      submit</text>
  </g>
</svg>

  <ng-container #pcChild6>
  </ng-container>
  <button matButton="filled" (click)="OnGenom()">Open</button>
  <button matButton="filled" (click)="OffGenom()">Close</button>
  <button matButton="filled" (click)="PlayGenom()">Play</button>
  <button matButton="filled" (click)="PauseGenom()">Pause</button>
</div>
