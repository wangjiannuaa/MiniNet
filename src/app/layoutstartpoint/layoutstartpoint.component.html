<div class="layoutstartpoint">
<form class="angular-form">
  <mat-form-field class="angular-full-width">
    <mat-label>message Hub</mat-label>
    <input matInput type="search" placeholder="Ex. Short Message" value="genom" (keydown.enter)="showmessage($event)">
  </mat-form-field>

  <mat-form-field class="angular-full-width">
    <mat-label>Leave a comment</mat-label>
    <textarea matInput placeholder="Ex. It makes me feel..."></textarea>
  </mat-form-field>
</form>
</div>
<div *ngIf="messagesearchresult">
<bw-layoutpagecube [layoutpagecube]=messagesearchresult>
</bw-layoutpagecube>
</div>
