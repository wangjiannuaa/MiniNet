<div class="layoutdirector" style="">
  <div>
      <ng-container #pcChild5>
      </ng-container>
 </div>
<div style="display:block;width:100%">
<mat-paginator #paginator
               class="angular-paginator"
	       style="width:600px;display:block;margin-left:auto;"
               (page)="handlePageEvent($event)"
               [length]="length()"
               [pageSize]="pageSize()"
               [disabled]="disabled()"
               [showFirstLastButtons]="showFirstLastButtons()"
               [pageSizeOptions]="showPageSizeOptions() ? pageSizeOptions() : []"
               [hidePageSize]="hidePageSize()"
               [pageIndex]="pageIndex()"
               aria-label="Select page">
</mat-paginator>
</div>

<div>
  <div class="layoutdirectorbuttonup">
      <button matIconButton aria-label="换到上一组">
        <mat-icon>arrow_upward</mat-icon>
      </button>
  </div>
  <div class="layoutdirectorbuttondown">
      <button matIconButton aria-label="换到下一组">
        <mat-icon>arrow_downward</mat-icon>
      </button>
  </div>
</div>
</div>
